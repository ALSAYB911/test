<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            width: 90%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, background 0.2s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-login {
            background: #4CAF50;
            color: white;
        }
        .btn-register {
            background: #2196F3;
            color: white;
        }
        .message {
            text-align: center;
            padding: 10px;
            margin-top: 20px;
            border-radius: 8px;
            display: none;
        }
        .message.success {
            background: rgba(76, 175, 80, 0.3);
            display: block;
        }
        .message.error {
            background: rgba(244, 67, 54, 0.3);
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>SA-MP Mobile</h1>
        
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>
        
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        
        <button class="btn-login" id="loginBtn">Login</button>
        <button class="btn-register" id="registerBtn">Register</button>
        
        <div class="message" id="message"></div>
    </div>

    <script>
        function showMessage(text, isError) {
            var msg = document.getElementById('message');
            msg.innerText = text;
            msg.className = 'message ' + (isError ? 'error' : 'success');
        }
        
        function sendToServer(action, data) {
            if (window.geckoju) {
                window.geckoju.send(JSON.stringify({
                    action: action,
                    data: data
                }));
            } else {
                console.log("Geckoju not available, data:", action, data);
            }
        }
        
        document.getElementById('loginBtn').onclick = function() {
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            
            if (!username || !password) {
                showMessage('Please fill all fields', true);
                return;
            }
            
            sendToServer('login', {
                username: username,
                password: password
            });
        };
        
        document.getElementById('registerBtn').onclick = function() {
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            
            if (!username || !password) {
                showMessage('Please fill all fields', true);
                return;
            }
            
            sendToServer('register', {
                username: username,
                password: password
            });
        };
        
        if (window.geckoju) {
            window.geckoju.onData = function(data) {
                try {
                    var obj = JSON.parse(data);
                    if (obj.message) {
                        showMessage(obj.message, obj.error);
                    }
                } catch(e) {
                    showMessage(data, false);
                }
            };
        }
    </script>
</body>
</html>
